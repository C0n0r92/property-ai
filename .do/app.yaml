name: irish-property-data
region: fra
services:
  - name: web
    github:
      repo: C0n0r92/property-ai
      branch: main
      deploy_on_push: true
    source_dir: /dashboard
    build_command: npm run build
    run_command: npm run start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 3000
    envs:
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        scope: RUN_AND_BUILD_TIME
        value: G-43FMLL1ZG0
      - key: NEXTAUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        value: 402kbrR3CT3PBkuq6LSPFHMDwCqKdbrpdbiOpEMzXiY=
      - key: NEXTAUTH_URL
        scope: RUN_AND_BUILD_TIME
        value: https://irishpropertydata.com
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: your_supabase_project_url_here
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        scope: RUN_AND_BUILD_TIME
        value: your_supabase_anon_key_here
      - key: NEXT_PUBLIC_BASE_URL
        scope: RUN_AND_BUILD_TIME
        value: https://irishpropertydata.com
      # Housing data (sales, register, listings) and report/email records
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # Set these three in the DigitalOcean dashboard, not in this file
      - key: STRIPE_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SMTP_URL
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_FROM
        scope: RUN_TIME
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
databases:
  - name: db
    engine: PG
    version: "16"
    production: true

jobs:
  # Apply db/*.sql before each deploy
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile.pipeline
    github:
      repo: C0n0r92/property-ai
      branch: main
    run_command: npm run migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

  # Register import, listing collection and matching, once a day
  - name: daily-data
    kind: SCHEDULED
    schedule:
      cron: "30 5 * * *"
      time_zone: Europe/Dublin
    dockerfile_path: Dockerfile.pipeline
    github:
      repo: C0n0r92/property-ai
      branch: main
    run_command: npm run daily
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

domains:
  - domain: irishpropertydata.com
    type: PRIMARY
  - domain: www.irishpropertydata.com
    type: ALIAS

