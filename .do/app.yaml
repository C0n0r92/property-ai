name: irish-property-data
region: fra
# Deployed from images in DigitalOcean's container registry ("gaff"), built
# and pushed by scripts/deploy.sh. TAG is replaced with the git commit when
# the script deploys; the images are built from Dockerfile (web) and
# Dockerfile.pipeline (jobs).
services:
  - name: web
    image:
      registry_type: DOCR
      repository: web
      tag: TAG
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8080
    envs:
      # Baked into the image at build time by scripts/deploy.sh; listed so
      # the running server sees the same value
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        scope: RUN_TIME
        value: G-43FMLL1ZG0
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_TIME
        value: https://irishpropertydata.com
      # Housing data (sales, register, listings) and report/email records
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # The database's certificate authority, so its certificate is checked
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      # Secrets: set in the DigitalOcean dashboard (or by the first deploy),
      # never in this file
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_URL
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_FROM
        scope: RUN_TIME
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
databases:
  # A production database must name an existing Managed Postgres cluster:
  # create "gaff-db" (PostgreSQL 16, Frankfurt) first, then fill it with
  # pipeline/scripts/copy-to-remote.sh
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: gaff-db

jobs:
  # Apply db/*.sql before each deploy
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: DOCR
      repository: pipeline
      tag: TAG
    run_command: npm run migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # The database's certificate authority, so its certificate is checked
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}

  # Register import, listing collection and matching, once a day
  - name: daily-data
    kind: SCHEDULED
    schedule:
      cron: "30 5 * * *"
      time_zone: Europe/Dublin
    image:
      registry_type: DOCR
      repository: pipeline
      tag: TAG
    run_command: npm run daily
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # The database's certificate authority, so its certificate is checked
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}

domains:
  # "zone" lets App Platform create the DNS records itself; the domain's
  # name servers (set at Namecheap) point at DigitalOcean
  - domain: irishpropertydata.com
    type: PRIMARY
    zone: irishpropertydata.com
  - domain: www.irishpropertydata.com
    type: ALIAS
    zone: irishpropertydata.com

